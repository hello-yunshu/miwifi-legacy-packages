<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>文件浏览</title>
<link rel="stylesheet" href="/__ui/app.css">
</head>
<body>
<header class="top">
  <div class="top-inner">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2.5h7A1.5 1.5 0 0 1 19 10v7.5A1.5 1.5 0 0 1 17.5 19h-13A1.5 1.5 0 0 1 3 17.5z"/></svg>
    </span>
    <div class="brand-text">
      <h1>文件浏览</h1>
      <p class="sub" id="sub">R2D 文件服务</p>
    </div>
  </div>
</header>

<main class="wrap">
  <nav class="crumbs" id="crumbs" aria-label="当前路径"></nav>

  <section class="panel">
    <div class="panel-head">
      <h2 id="dirTitle">目录</h2>
      <span class="count" id="count"></span>
    </div>
    <div class="cols" aria-hidden="true">
      <span>名称</span><span>大小</span><span>修改时间</span>
    </div>
    <ul class="list" id="list"></ul>
    <div class="state" id="state" hidden></div>
    <div class="foot" id="hint">浏览器内可浏览与下载；上传、改名、删除请用 WebDAV 客户端连接。</div>
  </section>
</main>

<script src="/__ui/app.js"></script>
</body>
</html>
