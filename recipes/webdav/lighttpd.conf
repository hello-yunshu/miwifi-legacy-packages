# R2D WebDAV production config: lighttpd 1.4.85 + mod_webdav
# Deployed at /userdisk/data/.dev/live/webdav/conf/lighttpd.conf
# Start it through run.sh (it passes -m <current>/lib and mounts the shares).

server.document-root = "/userdisk/data/.dev/live/webdav/webroot"
server.port = 5005
server.bind = "192.168.3.2"

server.modules = ( "mod_auth", "mod_authn_file", "mod_webdav" )

server.errorlog = "/userdisk/data/.dev/live/webdav/state/error.log"
server.pid-file = "/userdisk/data/.dev/live/webdav/state/lighttpd.pid"
server.upload-dirs = ( "/userdisk/data/.dev/live/webdav/state/tmp" )

# Run unprivileged after binding. Files created over WebDAV are owned by
# nobody:nogroup; run.sh starts with umask 000 so the modes match the Samba
# share masks (0666 files / 0777 dirs) and either service can still edit them.
server.username = "nobody"
server.groupname = "nogroup"

# Only the four bind-mounted share directories are reachable; no symlinks.
server.follow-symlink = "disable"

auth.backend = "htdigest"
auth.backend.htdigest.userfile = "/userdisk/data/.dev/live/webdav/conf/users.htdigest"
auth.require = ( "/" => ( "method" => "digest", "realm" => "r2d-webdav", "require" => "valid-user" ) )

webdav.activate = "enable"
webdav.is-readonly = "disable"
webdav.sqlite-db-name = "/userdisk/data/.dev/live/webdav/state/webdav.db"
