# R2D WebDAV production config: lighttpd 1.4.85 + mod_webdav
# Deployed at /userdisk/data/.yunshu/live/webdav/conf/lighttpd.conf
# Start it through run.sh (it passes -m <current>/lib and mounts the shares).

server.document-root = "/userdisk/data/.yunshu/live/webdav/webroot"
server.port = 5005
server.bind = "192.168.3.2"

server.modules = ( "mod_auth", "mod_authn_file", "mod_webdav", "mod_dirlisting" )

server.errorlog = "/userdisk/data/.yunshu/live/webdav/state/error.log"
server.pid-file = "/userdisk/data/.yunshu/live/webdav/state/lighttpd.pid"
server.upload-dirs = ( "/userdisk/data/.yunshu/live/webdav/state/tmp" )

# Run unprivileged after binding. Files created over WebDAV are owned by
# nobody:nogroup; run.sh starts with umask 000 so the modes match the Samba
# share masks (0666 files / 0777 dirs) and either service can still edit them.
server.username = "nobody"
server.groupname = "nogroup"

# Two roots mirror the SMB entries: 本机储存 (/userdisk/data) and 外接盘 (/extdisks/*).
# run.sh binds the contents in; nothing outside those two trees is reachable, and
# `.yunshu` / the top-level compatibility symlinks are never mounted in the first place.
# No symlinks are followed.
server.follow-symlink = "disable"

# 认证：Basic。原因：macOS 访达的 WebDAVLib 只支持 Basic，收到 Digest 挑战
# 后不重试直接放弃（实测只发一次 OPTIONS 就停在 401）。
# 因此只在内网开放、不做 WAN 端口转发；口令为随机强口令，文件仅 nobody 可读。
auth.backend = "plain"
auth.backend.plain.userfile = "/userdisk/data/.yunshu/live/webdav/conf/users.basic"
auth.require = ( "/" => ( "method" => "basic", "realm" => "r2d-webdav", "require" => "valid-user" ) )

webdav.activate = "enable"
webdav.is-readonly = "disable"
webdav.sqlite-db-name = "/userdisk/data/.yunshu/live/webdav/state/webdav.db"

# GET 目录时返回 HTML 列表。WebDAV 客户端走 PROPFIND 不受影响，但浏览器
# 直接打开根路径需要一个列表页，否则 lighttpd 会返回 403。
# dir-listing.encoding 同时决定 Content-Type 的 charset 和页面里的
# <meta charset>；不设时只有 text/html，浏览器会把 UTF-8 中文显示成乱码。
dir-listing.activate = "enable"
dir-listing.hide-dotfiles = "enable"
dir-listing.encoding = "utf-8"

