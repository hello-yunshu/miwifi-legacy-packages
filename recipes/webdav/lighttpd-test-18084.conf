# Isolated WebDAV test instance configuration (port 18084).
# Used by the B6 guard/watchdog verification; not a production config.
server.document-root = "/userdisk/data/r2d-cand/b6-webdav/webdav"
server.port = 18084
server.bind = "192.168.3.2"
server.modules = ( "mod_auth", "mod_authn_file", "mod_webdav" )
server.errorlog = "/userdisk/data/s8webdav/error.log"
server.pid-file = "/userdisk/data/s8webdav/lighttpd.pid"
server.upload-dirs = ( "/userdisk/data/s8webdav/tmp" )
auth.backend = "plain"
auth.backend.plain.userfile = "/userdisk/data/s8webdav/users.conf"
auth.require = ( "/" => ( "method" => "basic", "realm" => "r2d-webdav", "require" => "valid-user" ) )
webdav.activate = "enable"
webdav.is-readonly = "disable"
webdav.sqlite-db-name = "/userdisk/data/s8webdav/webdav.db"
mimetype.assign = ( ".txt" => "text/plain" )
